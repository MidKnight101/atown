<!DOCTYPE html>
<html lang="en>
<head>
    <meta charset = "UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book with Us!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <div class="navbar-container">
        <header>
            <div class="container">
                <a href="index.html" style="text-decoration: none;">
                    <h1>A-TOWN TAPS</h1>
                </a>
                <nav>
                    <a href="index.html#about">About</a>
                    <a href="index.html#services">Services</a>
                    <a href="contact.html" class="nav-cta">Book Now</a>
                </nav>
            </div>
        </header>
    </div>

    <section id="contact-page">
        <div class="container form-wrapper">
            <h2 class="section-title">Let's Tap In</h2>
            <p class="form-subtitle">Tell us about your event and we'll follow up with a tailored quote.</p>

            <form action="https://formspree.io/f/mnjbogzk" method="post" class="branded-form">
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" name="name" placeholder="First & Last Name" required>
                </div>

                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" name="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <label>Organization / Brand</label>
                    <input type="text" name="org" placeholder="Company Name">
                </div>
                <div class="form-group">
                    <label>Event Type</label>
                    <input type="text" name="event_type" placeholder="e.g. Corporate, Festival, Brand Activation">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Event Date</label>
                        <input type="date" name="date">
                    </div>
                    <div class="form-group">
                        <label>Guest Count</label>
                        <input type="number" name="guests" placeholder="Estimated attendees">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Additional Details</label>
                    <textarea name="questions" placeholder="What questions do you have for us?">
                    </textarea>
                </div>

                <button type="submit" class="submit-button">Send</button>
            </form>
        </div>
    </section>

    <footer>
        <p>Contact: atowntaps@gmail.com</p>
        <p>&copy; 2026 A-Town Taps Co.</p>
    </footer>
</body>


</html>
